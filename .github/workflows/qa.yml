name: Burnsville QA

on:
  push:
    branches:
      - modernise/burnsville-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Runtime versions
        run: |
          node --version
          npm --version

      - name: Recover current root lockfile
        run: npm install --package-lock-only --include=dev

      - name: Install backend dependencies
        run: npm ci

      - name: Recover current frontend lockfile
        run: npm install --prefix frontend --package-lock-only --include=dev

      - name: Build Vite frontend
        run: npm run build

      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name burnsville-mongo \
            -p 27017:27017 \
            mongo:8.0 \
            --replSet rs0 --bind_ip_all

          for attempt in {1..30}; do
            if docker exec burnsville-mongo mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1; then
              break
            fi
            sleep 2
          done

          docker exec burnsville-mongo mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"

          for attempt in {1..30}; do
            if docker exec burnsville-mongo mongosh --quiet --eval \
              "rs.status().myState" | grep -q 1; then
              break
            fi
            sleep 2
          done

          docker exec burnsville-mongo mongosh --quiet --eval \
            "if (rs.status().myState !== 1) { quit(1) }"

      - name: Seed isolated QA database
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/burnsville_qa?replicaSet=rs0
          JWT_SECRET: burnsville-ci-only-secret
          NODE_ENV: test
        run: npm run data:import

      - name: Start API test runtime
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/burnsville_qa?replicaSet=rs0
          JWT_SECRET: burnsville-ci-only-secret
          NODE_ENV: test
          PORT: '5001'
        run: |
          node backend/server.js > /tmp/burnsville-api.log 2>&1 &
          echo $! > /tmp/burnsville-server.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5001/api/products > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/burnsville-api.log
          exit 1

      - name: Run integrated API QA
        env:
          BASE_URL: http://127.0.0.1:5001
        run: node qa/integrated-api.mjs

      - name: Restart in production mode
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/burnsville_qa?replicaSet=rs0
          JWT_SECRET: burnsville-ci-only-secret
          NODE_ENV: production
          PORT: '5001'
        run: |
          kill "$(cat /tmp/burnsville-server.pid)"
          wait "$(cat /tmp/burnsville-server.pid)" 2>/dev/null || true

          node backend/server.js > /tmp/burnsville-production.log 2>&1 &
          echo $! > /tmp/burnsville-server.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5001/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/burnsville-production.log
          exit 1

      - name: Run production serving QA
        env:
          BASE_URL: http://127.0.0.1:5001
        run: node qa/production-static.mjs

      - name: Audit production dependencies
        run: |
          set +e
          npm audit --omit=dev --audit-level=high
          backend_status=$?
          npm audit --prefix frontend --omit=dev --audit-level=high
          frontend_status=$?
          set -e

          if [ "$backend_status" -ne 0 ] || [ "$frontend_status" -ne 0 ]; then
            exit 1
          fi

      - name: Verify generated lockfile scope
        if: github.event_name == 'push'
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^(package-lock\.json|frontend/package-lock\.json)$' || true)"

          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git status --short

      - name: Persist generated lockfiles
        if: github.event_name == 'push'
        run: |
          git add package-lock.json frontend/package-lock.json

          if git diff --cached --quiet; then
            echo 'Lockfiles already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): refresh dependency lockfiles'
          git push origin HEAD:modernise/burnsville-v2

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/burnsville-server.pid ]; then
            kill "$(cat /tmp/burnsville-server.pid)" 2>/dev/null || true
          fi
          docker rm -f burnsville-mongo 2>/dev/null || true
          echo '--- API log ---'
          cat /tmp/burnsville-api.log 2>/dev/null || true
          echo '--- Production log ---'
          cat /tmp/burnsville-production.log 2>/dev/null || true
