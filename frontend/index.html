<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#000000" />
    <meta
      name="description"
      content="Best valued products online" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css"
      integrity="sha512-+4zCK9k+qNFUR5X+cKL9EIR+ZOhtIloNl9GIKS57V1MyNsYpYcUrUeQc9vNfzsWfV28IaLL3i96P9sdNyeRssA=="
      crossorigin="anonymous" />
    <title>Welcome to Burnsville</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (() => {
        const reportClientDiagnostic = (kind, message, detail = {}) => {
          const payload = {
            kind,
            message: String(message || 'Unknown client error').slice(0, 1200),
            ...detail,
          };

          fetch('/api/client-diagnostic', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            keepalive: true,
          }).catch(() => {});
        };

        window.addEventListener('error', (event) => {
          reportClientDiagnostic('error', event.message, {
            source: event.filename,
            line: event.lineno,
            column: event.colno,
            stack: event.error && event.error.stack,
          });
        });

        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason;
          reportClientDiagnostic(
            'unhandledrejection',
            reason && reason.message ? reason.message : reason,
            { stack: reason && reason.stack }
          );
        });
      })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
